<script>
const fallback=[
{id:1,cat:"స్పోర్ట్స్",tag:"BREAKING",title:"శ్రీలంకతో రెండో టెస్టులో భారత్ 2-0 సిరీస్‌పై ఫోకస్",desc:"కొలంబోలో రెండో, చివరి టెస్టులో భారత్ విజయంతో సిరీస్‌ను క్లీన్ స్వీప్ చేయాలని చూస్తోంది.",img:"https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&w=1400&q=85"},
{id:2,cat:"సినిమా",tag:"సినిమా",title:"‘Irumudi’ బాక్సాఫీస్ జోరు.. రెండో రోజూ మంచి వసూళ్లు",desc:"రవితేజ నటించిన చిత్రం రెండో రోజున కూడా బలమైన వసూళ్లు సాధించినట్లు ట్రేడ్ రిపోర్టులు చెబుతున్నాయి.",img:"https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=1000&q=85"}
];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const id=Number(new URLSearchParams(location.search).get("id"))||1;
async function load(){
 let a;
 try{const r=await fetch("/api/news",{cache:"no-store"});const d=await r.json();a=(d||[]).find(x=>Number(x.id)===id)}catch(e){}
 if(!a)a=fallback.find(x=>x.id===id)||fallback[0];
 document.title=titleOf(a)+" | VYRO NEWS";
 document.getElementById("article").innerHTML=`<div class="article-cat">${esc(a.cat||a.category||"తాజా వార్తలు")} • ${esc(a.tag||"LATEST")}</div><h1>${esc(titleOf(a))}</h1><div class="meta">VYRO NEWS | 23 ఆగస్టు 2026</div><img src="${a.img||a.image_url||""}" alt=""><p>${esc(a.desc||a.content||"VYRO NEWS తాజా సమాచారం.")}</p><p>ఈ కథనానికి సంబంధించిన పూర్తి వివరాలను VYRO NEWSలో అప్‌డేట్ చేస్తూ ఉంటాం. మరిన్ని తాజా వార్తల కోసం హోమ్ పేజీని చూడండి.</p><p><a class="back" href="/">← హోమ్‌కి తిరిగి వెళ్లండి</a></p>`;
}
function titleOf(a){return a.title||"VYRO NEWS";}
load();
</script></body></html>
