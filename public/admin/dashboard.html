<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYRO NEWS — Admin Dashboard</title><link rel="stylesheet" href="/admin/admin.css"></head><body><header class="adminbar"><div><strong>VYRO <b>NEWS</b></strong><span>ADMIN DASHBOARD</span></div><div><a href="/" target="_blank">View Website</a><button id="logout">Logout</button></div></header><main class="admin-wrap"><section class="panel form-panel"><div class="panel-head"><h1 id="formTitle">Add News</h1><button id="newBtn" class="ghost">+ New</button></div><form id="newsForm"><input type="hidden" id="newsId"><div class="grid2"><label>Title<input id="title" required placeholder="News headline"></label><label>Category<select id="category" required><option>ఆంధ్రప్రదేశ్</option><option>తెలంగాణ</option><option>భారతదేశం</option><option>సినిమా</option><option>స్పోర్ట్స్</option><option>బిజినెస్</option><option>టెక్నాలజీ</option></select></label></div><label>Content<textarea id="content" rows="6" required placeholder="News content"></textarea></label><div class="grid2"><label>Image URL<input id="image_url" placeholder="https://... or /uploads/..."/></label><label>Upload Image<input id="image" type="file" accept="image/*"><small id="uploadStatus"></small></label></div><div class="checks"><label><input id="breaking" type="checkbox"> Breaking News</label><label><input id="featured" type="checkbox"> Featured / Top Story</label><label>Status<select id="status"><option>Draft</option><option>Published</option></select></label></div><div class="actions"><button class="primary" type="submit">Save News</button><button class="ghost" type="button" id="cancelBtn">Cancel</button></div><div id="formMsg" class="msg"></div></form></section><section class="panel"><div class="panel-head"><h2>All News</h2><span id="count"></span></div><div id="newsTable" class="table-wrap"></div></section></main><script src="/admin/dashboard.js"></script></body></html>
