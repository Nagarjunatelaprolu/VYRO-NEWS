<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYRO NEWS Admin</title><link rel="stylesheet" href="../shared.css"></head><body>
<header class="topbar"><div class="brand"><span class="v">V</span>YRO <b>NEWS</b></div><div><span>ADMIN</span> <button class="btn red" id="logout">Logout</button></div></header>
<main class="container"><section class="stats"><div class="stat"><small>Total News</small><strong id="total">0</strong></div><div class="stat"><small>Breaking</small><strong id="breakingTotal">0</strong></div><div class="stat"><small>Published</small><strong id="published">0</strong></div><div class="stat"><small>Featured</small><strong id="featuredTotal">0</strong></div></section>
<section class="grid"><div class="card"><h2>➕ Add / Edit News</h2><form id="form"><input class="field" id="title" required placeholder="News title"><div class="row"><select class="field" id="category"><option>ఆంధ్రప్రదేశ్</option><option>తెలంగాణ</option><option>జాతీయ</option><option>అంతర్జాతీయ</option><option>సినిమా</option><option>స్పోర్ట్స్</option><option>బిజినెస్</option></select><input class="field" id="image" placeholder="Image URL"></div><textarea class="field textarea" id="content" required placeholder="Full news content"></textarea><label class="check"><input id="isBreaking" type="checkbox"> Breaking News</label><label class="check"><input id="isFeatured" type="checkbox"> Featured</label><div style="text-align:right;margin-top:12px"><button type="button" class="btn white" id="draft">Save Draft</button> <button class="btn red">Publish News</button></div></form></div>
<div class="card"><h2>📰 Recent News</h2><div id="list"></div></div></section>
<section class="card" style="margin-top:18px"><h2>🌐 Live Site Preview</h2><div id="preview"></div></section></main>
<script>
if(sessionStorage.getItem("vyroAdmin")!=="1") location.replace("login.html");
const KEY="vyroNewsDB"; let data=JSON.parse(localStorage.getItem(KEY)||"[]");
if(!data.length){data=[{id:1,title:"VYRO NEWS — తాజా వార్తల కోసం మీ విశ్వసనీయ వేదిక",category:"జాతీయ",content:"ఇది VYRO NEWS demo article. Admin panel నుంచి కొత్త వార్త publish చేస్తే live siteలో కనిపిస్తుంది.",image:"",breaking:true,featured:true,status:"Published",date:"20 Aug 2026"}];saveDB()}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){total.textContent=data.length;breakingTotal.textContent=data.filter(x=>x.breaking).length;published.textContent=data.filter(x=>x.status==="Published").length;featuredTotal.textContent=data.filter(x=>x.featured).length;list.innerHTML=data.map(x=>'<div class="news-item"><img src="'+(x.image||'')+'"><div><h3>'+ (x.breaking?'<span class="badge">BREAKING</span>':'') +esc(x.title)+'</h3><small>'+esc(x.category)+' • '+esc(x.status)+' • '+esc(x.date)+'</small><br><button class="mini" onclick="editNews('+x.id+')">Edit</button><button class="mini" onclick="deleteNews('+x.id+')">Delete</button></div></div>').join("")||'<div class="empty">No news</div>';preview.innerHTML=data.filter(x=>x.status==="Published").slice(0,5).map(x=>'<div style="padding:10px;border-bottom:1px solid #eee"><b>'+esc(x.title)+'</b><br><small>'+esc(x.category)+'</small></div>').join("")}
function saveNews(status){let n={id:Date.now(),title:title.value.trim(),category:category.value,content:content.value.trim(),image:image.value.trim(),breaking:isBreaking.checked,featured:isFeatured.checked,status,date:new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})};if(!n.title||!n.content)return alert("Title and content required");data.unshift(n);saveDB();form.reset();render();alert(status+" successfully")}
form.onsubmit=e=>{e.preventDefault();saveNews("Published")};draft.onclick=()=>saveNews("Draft");
function deleteNews(id){if(confirm("Delete this news?")){data=data.filter(x=>x.id!==id);saveDB();render()}}
function editNews(id){let n=data.find(x=>x.id===id);title.value=n.title;category.value=n.category;image.value=n.image||"";content.value=n.content;isBreaking.checked=!!n.breaking;isFeatured.checked=!!n.featured;data=data.filter(x=>x.id!==id);saveDB();render();scrollTo(0,0)}
logout.onclick=()=>{sessionStorage.removeItem("vyroAdmin");location.href="login.html"};render();
</script></body></html>
