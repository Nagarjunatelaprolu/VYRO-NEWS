<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>VYRO NEWS</title>

  <link rel="stylesheet" href="/shared.css">

  <style>
    .news-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .story {
      overflow: hidden;
    }

    .story-content {
      padding: 16px;
    }

    .story-content h3 {
      margin: 8px 0;
    }

    .story-content p {
      margin: 0;
    }

    .hero-image {
      width: 100%;
      max-height: 430px;
      object-fit: cover;
      margin-top: 20px;
      border-radius: 14px;
    }

    .hero-content {
      padding: 10px 0 25px;
    }

    .hero-content h1 {
      margin-bottom: 10px;
    }

    .meta {
      opacity: .7;
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      background: #e00000;
      color: #fff;
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
    }

    .error {
      padding: 30px 20px;
      text-align: center;
    }

    .loading {
      padding: 30px 20px;
      text-align: center;
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <span class="v">V</span>YRO <b>NEWS</b>
  </div>

  <a class="btn red" href="/admin/login.html">
    Admin
  </a>
</header>


<!-- BREAKING NEWS TICKER -->
<div class="ticker" id="ticker">
  BREAKING NEWS
</div>


<!-- HERO -->
<section class="hero">

  <div class="container hero-content">

    <div id="heroBadge"></div>

    <img
      id="heroImage"
      class="hero-image"
      style="display:none"
      alt="VYRO NEWS"
    >

    <h1 id="heroTitle">
      VYRO NEWS
    </h1>

    <p id="heroText">
      తెలుగు రాష్ట్రాల తాజా వార్తలు
    </p>

    <div id="heroMeta" class="meta"></div>

  </div>

</section>


<!-- LATEST NEWS -->
<main class="container">

  <section class="section">

    <h2>
      Latest News
    </h2>

    <div
      class="cards"
      id="cards"
    >
      <div class="loading">
        News loading...
      </div>
    </div>

  </section>

</main>


<script>

const API = "/api/news";


/* --------------------------------
   DATE FORMAT
-------------------------------- */

function formatDate(date) {

  if (!date) return "";

  try {

    return new Date(date).toLocaleString(
      "te-IN",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );

  } catch {

    return date;

  }

}


/* --------------------------------
   ESCAPE HTML
-------------------------------- */

function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* --------------------------------
   LOAD NEWS
-------------------------------- */

async function loadNews() {

  const ticker = document.getElementById("ticker");
  const cards = document.getElementById("cards");

  try {

    const response = await fetch(API);

    if (!response.ok) {
      throw new Error("API request failed");
    }

    const news = await response.json();

    const published = Array.isArray(news)
      ? news
      : [];


    /* --------------------------------
       NO NEWS
    -------------------------------- */

    if (!published.length) {

      ticker.textContent = "VYRO NEWS";

      cards.innerHTML = `
        <div class="empty">
          <h3>News త్వరలో అందుబాటులోకి వస్తుంది</h3>
          <p>
            Admin panel ద్వారా మొదటి వార్తను publish చేయండి.
          </p>
        </div>
      `;

      return;

    }


    /* --------------------------------
       HERO NEWS
    -------------------------------- */

    const hero = published[0];

    const heroTitle =
      document.getElementById("heroTitle");

    const heroText =
      document.getElementById("heroText");

    const heroBadge =
      document.getElementById("heroBadge");

    const heroImage =
      document.getElementById("heroImage");

    const heroMeta =
      document.getElementById("heroMeta");


    heroTitle.textContent =
      hero.title || "VYRO NEWS";

    heroText.textContent =
      hero.content || "";

    heroMeta.textContent =
      `${hero.category || "News"} • ${formatDate(hero.created_at)}`;


    if (hero.breaking) {

      heroBadge.innerHTML =
        `<span class="badge">BREAKING NEWS</span>`;

    } else {

      heroBadge.innerHTML = "";

    }


    /* HERO IMAGE */

    if (hero.image_url) {

      heroImage.src = hero.image_url;

      heroImage.style.display = "block";

    } else {

      heroImage.style.display = "none";

    }


    /* --------------------------------
       BREAKING NEWS TICKER
    -------------------------------- */

    const breakingNews =
      published.filter(
        item => Number(item.breaking) === 1
      );


    if (breakingNews.length) {

      ticker.textContent =
        breakingNews
          .slice(0, 5)
          .map(item => item.title)
          .join("  •  ");

    } else {

      ticker.textContent =
        "VYRO NEWS • తెలుగు రాష్ట్రాల తాజా వార్తలు";

    }


    /* --------------------------------
       NEWS CARDS
    -------------------------------- */

    cards.innerHTML =
      published
        .map(item => {

          const image = item.image_url
            ? `
              <img
                class="news-image"
                src="${escapeHTML(item.image_url)}"
                alt="${escapeHTML(item.title)}"
                loading="lazy"
              >
            `
            : "";


          const breaking =
            Number(item.breaking) === 1
              ? `<span class="badge">BREAKING</span>`
              : "";


          return `

            <article class="story">

              ${image}

              <div class="story-content">

                ${breaking}

                <div class="meta">
                  ${escapeHTML(item.category || "News")}
                  •
                  ${formatDate(item.created_at)}
                </div>

                <h3>
                  ${escapeHTML(item.title)}
                </h3>

                <p>
                  ${escapeHTML(item.content)}
                </p>

              </div>

            </article>

          `;

        })
        .join("");


  } catch (error) {

    console.error(
      "VYRO NEWS API ERROR:",
      error
    );


    cards.innerHTML = `

      <div class="error">

        <h3>
          News load అవ్వలేదు
        </h3>

        <p>
          Please try again later.
        </p>

      </div>

    `;

  }

}


/* --------------------------------
   START
-------------------------------- */

loadNews();

</script>

</body>
</html>
