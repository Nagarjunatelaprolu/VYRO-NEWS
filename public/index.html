<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VYRO NEWS</title>
  <link rel="stylesheet" href="/shared.css">
</head>

<body>

<header class="topbar">
  <div class="brand">
    <span class="v">V</span>YRO <b>NEWS</b>
  </div>

  <a class="btn red" href="/admin/login.html">Admin</a>
</header>

<!-- BREAKING NEWS -->
<div class="ticker">
  <strong>BREAKING NEWS</strong>
  <span id="tickerText">Latest Telugu News Updates</span>
</div>

<!-- HERO -->
<section class="hero">
  <div class="container">

    <div id="heroBadge"></div>

    <h1 id="heroTitle">
      VYRO NEWS
    </h1>

    <p id="heroText">
      తెలుగు రాష్ట్రాల తాజా వార్తలు
    </p>

  </div>
</section>

<!-- MAIN CONTENT -->
<main class="container">

  <section class="section">

    <h2>Latest News</h2>

    <div class="cards" id="cards">
      <div class="empty">
        News loading...
      </div>
    </div>

  </section>

</main>


<script>

async function loadNews() {

  try {

    const response = await fetch("/api/news");

    if (!response.ok) {
      throw new Error("News API failed");
    }

    let news = await response.json();

    /*
      Latest news first
    */
    news.sort((a, b) =>
      new Date(b.created_at) - new Date(a.created_at)
    );


    if (!news.length) {

      loadDemoNews();

      return;
    }


    renderNews(news);

  } catch (error) {

    console.error(error);

    /*
      API unavailable అయితే demo news
    */
    loadDemoNews();

  }

}


/* =========================
   RENDER NEWS
========================= */

function renderNews(news) {

  const heroTitle = document.getElementById("heroTitle");
  const heroText = document.getElementById("heroText");
  const heroBadge = document.getElementById("heroBadge");
  const tickerText = document.getElementById("tickerText");
  const cards = document.getElementById("cards");


  const latest = news[0];


  /* HERO */

  heroTitle.textContent = latest.title;

  heroText.textContent = latest.content;


  if (latest.breaking) {

    heroBadge.innerHTML =
      '<span class="badge">BREAKING NEWS</span>';

  } else {

    heroBadge.innerHTML =
      '<span class="badge">LATEST NEWS</span>';

  }


  /* TICKER */

  const breaking = news
    .filter(x => Number(x.breaking) === 1)
    .slice(0, 5)
    .map(x => x.title);

  tickerText.textContent =
    breaking.length
      ? breaking.join("  •  ")
      : news.slice(0, 5).map(x => x.title).join("  •  ");


  /* CARDS */

  cards.innerHTML = news.map(item => {

    const date = item.created_at
      ? new Date(item.created_at).toLocaleDateString(
          "te-IN",
          {
            day: "2-digit",
            month: "short",
            year: "numeric"
          }
        )
      : "";


    const image = item.image_url
      ? `<img src="${item.image_url}" alt="${escapeHtml(item.title)}">`
      : "";


    const badge = Number(item.breaking) === 1
      ? `<span class="badge">BREAKING</span>`
      : "";


    return `

      <article class="story">

        ${image}

        <div class="story-content">

          ${badge}

          <small>
            ${escapeHtml(item.category)} • ${date}
          </small>

          <h3>
            ${escapeHtml(item.title)}
          </h3>

          <p>
            ${escapeHtml(item.content)}
          </p>

        </div>

      </article>

    `;

  }).join("");

}

/* =========================
   SECURITY
========================= */

function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   START
========================= */

</script>
