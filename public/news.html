<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYRO NEWS</title><link rel="stylesheet" href="/styles.css"><style>.article{max-width:1000px;margin:20px auto;padding:0 20px}.article img{width:100%;max-height:560px;object-fit:cover;border-radius:8px}.article .tag{display:inline-block;background:#df0808;color:#fff;padding:5px 10px;margin-top:18px;font-weight:800}.article h1{font-size:40px;line-height:1.25;margin:12px 0}.article .meta{color:#777;margin-bottom:18px}.article .body{font-size:19px;line-height:1.9}.backlink{display:inline-block;margin:15px 0;color:#df0808;font-weight:800}@media(max-width:700px){.article h1{font-size:28px}}</style></head><body><div class="topline"><div>VYRO NEWS</div><div>తెలుగు | English</div></div><header class="masthead"><a class="logo" href="/"><span class="logo-v">V</span><span>YRO</span><strong>NEWS</strong><small>TELUGU NEWS PORTAL</small></a><div class="adbox"><div><b>FOR ADS ON VYRO NEWS</b><br><span>REACH MILLIONS OF READERS</span></div><button>CONTACT US</button></div></header><nav class="nav"><a href="/">హోమ్</a><a href="/#andhra">ఆంధ్రప్రదేశ్</a><a href="/#telangana">తెలంగాణ</a><a href="/#bharat">భారతదేశం</a><a href="/#cinema">సినిమా</a><a href="/#sports">స్పోర్ట్స్</a><a class="admin" href="/admin/login.html">Admin</a></nav><main class="article" id="article"><a class="backlink" href="/">← VYRO NEWS HOME</a><p>వార్త లోడ్ అవుతోంది...</p></main><footer><div class="copyright">© 2026 VYRO NEWS. All Rights Reserved.</div></footer><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const id=new URLSearchParams(location.search).get('id');fetch('/api/news/'+encodeURIComponent(id||'' )).then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{document.title=x.title+' — VYRO NEWS';article.innerHTML='<a class="backlink" href="/">← VYRO NEWS HOME</a>'+(x.breaking?'<span class="tag">BR
